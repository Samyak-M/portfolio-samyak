<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <meta name="description" content="Portfolio of Samyak Mukherjee, Technical Writer." />
  <link rel="stylesheet" href="styles.css" />

<body>

  <header id="hero">

    <section id="projects" hidden>

    </section>

    <section id="certificates" hidden>

      <ul id="cert-list"></ul>
    </section>

    <section id="awards" hidden>
      <h2>Awards</h2>
      <ul id="award-list"></ul>

  <script src="app.js" defer></script>
